workflows:
  # ── Screenshots da paywall no Simulador iOS ────────────────────────────────
  # Gera os PNGs no tamanho nativo de cada device (6.9" é o set OBRIGATÓRIO da
  # App Store; serve também para o "Review Screenshot" obrigatório de cada IAP).
  # NÃO precisa de assinatura/App Store Connect: roda só em simulador.
  # Baixe os artefatos em build/screenshots/ ao final do build.
  ios-screenshots:
    name: Kairo iOS - Screenshots (Simulador)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Criar .env dummy (asset exigido pelo bundle; o teste não o lê)
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_KEY=placeholder-anon-key
          EOF
      - name: flutter pub get
        script: flutter pub get
      - name: Instalar CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Capturar screenshots da paywall
        script: |
          set -e
          mkdir -p build/screenshots

          # "Nome do simulador|rótulo (tamanho App Store)".
          # iPhone 16 Pro Max = 6.9" (1320×2868) → OBRIGATÓRIO.
          # iPhone 11 Pro Max = 6.5" (1242×2688) e iPad 13" → opcionais (pulam
          # automaticamente se o runtime não estiver instalado nesta máquina).
          DEVICES=(
            "iPhone 16 Pro Max|iphone-6.9"
            "iPhone 11 Pro Max|iphone-6.5"
            "iPad Pro 13-inch (M4)|ipad-13"
          )

          for entry in "${DEVICES[@]}"; do
            NAME="${entry%%|*}"
            LABEL="${entry##*|}"

            LINE=$(xcrun simctl list devices available | grep -F "$NAME (" | head -1 || true)
            UDID=$(echo "$LINE" | grep -oiE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' || true)
            if [ -z "$UDID" ]; then
              echo ">> '$NAME' indisponível nesta imagem — pulando."
              continue
            fi

            echo ">> Capturando em $NAME ($LABEL) :: $UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true

            if flutter drive \
                --driver=test_driver/integration_test.dart \
                --target=integration_test/screenshot_test.dart \
                -d "$UDID"; then
              if [ -f build/screenshots/paywall-premium.png ]; then
                mv build/screenshots/paywall-premium.png \
                   "build/screenshots/${LABEL}-paywall-premium.png"
              fi
            else
              echo ">> flutter drive falhou em $NAME (seguindo para o próximo)."
            fi
            xcrun simctl shutdown "$UDID" || true
          done

          echo "── Screenshots gerados ──"
          ls -la build/screenshots || true
    artifacts:
      - build/screenshots/*.png
    publishing:
      email:
        recipients:
          - realpedroluizchagas@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Kairo iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Nome da chave da App Store Connect API cadastrada em
      # Codemagic > Teams > Integrations > App Store Connect.
      app_store_connect: kairo_asc_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Grupo de variaveis criado em Codemagic > Environment variables.
        # Deve conter SUPABASE_URL e SUPABASE_KEY (recriam o .env no build).
        - kairo_env
    scripts:
      - name: Recriar arquivo .env (asset exigido pelo app)
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          EOF
      - name: flutter pub get
        script: flutter pub get
      - name: Instalar CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Configurar assinatura (certificado dedicado de CI + profile)
        script: |
          keychain initialize
          # A chave privada chega em base64 (variavel CERTIFICATE_PRIVATE_KEY_B64)
          # para evitar problemas com quebras de linha; decodifica para um .pem.
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/ci_cert_key.pem
          app-store-connect fetch-signing-files "com.thekairo.app" \
            --type IOS_APP_STORE \
            --certificate-key="@file:/tmp/ci_cert_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA (release)
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s) / 60)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Beta testers internos recebem automaticamente apos o processamento.
      email:
        recipients:
          - realpedroluizchagas@gmail.com
        notify:
          success: true
          failure: true

  android-internal:
    name: Kairo Android - Internal Testing
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        # Mesmo grupo do iOS: SUPABASE_URL e SUPABASE_KEY (recriam o .env).
        - kairo_env
        # Criar em Codemagic > Environment variables (marcar "Secure"):
        #   CM_KEYSTORE          = base64 da upload key  (base64 -w0 ~/kairo-upload.jks)
        #   CM_KEYSTORE_PASSWORD = senha do keystore
        #   CM_KEY_ALIAS         = upload
        #   CM_KEY_PASSWORD      = senha da key
        - kairo_android_sign
        # Service account JSON (Play Developer API) com permissao de publicar na
        # trilha interna. Pode ser a MESMA SA da fase D (re-fetch), desde que
        # tambem receba "Release to testing tracks".
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = JSON inteiro da service account
        - kairo_google_play
    scripts:
      - name: Recriar arquivo .env (asset exigido pelo app)
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          EOF
      - name: Materializar upload key + key.properties
        script: |
          # A keystore chega em base64 (evita quebras de linha em variavel).
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          # key.properties no formato lido por android/app/build.gradle.kts.
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_BUILD_DIR/android/app/upload-keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: flutter pub get
        script: flutter pub get
      - name: Build AAB (release)
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s) / 60))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - realpedroluizchagas@gmail.com
        notify:
          success: true
          failure: true
      # ⚠️ Mantenha COMENTADO ate o 1o AAB ser enviado MANUALMENTE pelo Play
      # Console (a 1a versao de um app novo precisa ser subida pela UI para
      # ativar o Play App Signing). Depois disso, descomente para publicar
      # automaticamente na trilha interna a cada build.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: false
